[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[project]
name = "flowcastle"
version = "0.1.0"
description = "Framework-neutral FlowCastle protocol v2 runtime with Telegram adapters"
readme = "README.md"
requires-python = ">=3.10"
license = { text = "MIT" }
authors = [{ name = "FlowCastle" }]
classifiers = [
  "Programming Language :: Python :: 3",
  "Programming Language :: Python :: 3 :: Only",
  "Typing :: Typed",
]
dependencies = []

[project.urls]
Homepage = "https://flowcastle.ai"
Repository = "https://github.com/FlowCastle/flowcastle-sdk"
Issues = "https://github.com/FlowCastle/flowcastle-sdk/issues"
Documentation = "https://github.com/FlowCastle/flowcastle-sdk#readme"

[project.optional-dependencies]
aiogram = ["aiogram>=3,<4"]
python-telegram-bot = ["python-telegram-bot>=21,<23"]
dev = ["pytest>=8", "pytest-asyncio>=0.23", "mypy>=1.10"]

[tool.hatch.build.targets.wheel]
packages = ["src/flowcastle"]

[tool.pytest.ini_options]
asyncio_mode = "auto"
testpaths = ["tests"]

[tool.mypy]
python_version = "3.10"
strict = true
files = ["src/flowcastle"]
