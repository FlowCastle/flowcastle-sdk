[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[project]
name = "flowcastle"
version = "0.1.1"
description = "Add CRM, Live Chat, broadcasts and analytics to your Telegram bot — FlowCastle SDK for aiogram and python-telegram-bot"
readme = "README.md"
requires-python = ">=3.10"
license = { text = "MIT" }
authors = [{ name = "FlowCastle" }]
keywords = ["telegram", "telegram-bot", "aiogram", "python-telegram-bot", "chatbot", "crm", "analytics", "live-chat", "broadcast", "flowcastle"]
classifiers = [
  "Development Status :: 4 - Beta",
  "Intended Audience :: Developers",
  "License :: OSI Approved :: MIT License",
  "Framework :: AsyncIO",
  "Topic :: Communications :: Chat",
  "Topic :: Software Development :: Libraries :: Python Modules",
  "Programming Language :: Python :: 3",
  "Programming Language :: Python :: 3 :: Only",
  "Programming Language :: Python :: 3.10",
  "Programming Language :: Python :: 3.11",
  "Programming Language :: Python :: 3.12",
  "Programming Language :: Python :: 3.13",
  "Typing :: Typed",
]
dependencies = []

[project.urls]
Homepage = "https://flowcastle.ai"
Repository = "https://github.com/FlowCastle/flowcastle-sdk"
Issues = "https://github.com/FlowCastle/flowcastle-sdk/issues"
Documentation = "https://github.com/FlowCastle/flowcastle-sdk#readme"

[project.optional-dependencies]
aiogram = ["aiogram>=3,<4"]
python-telegram-bot = ["python-telegram-bot>=21,<23"]
dev = ["pytest>=8", "pytest-asyncio>=0.23", "mypy>=1.10"]

[tool.hatch.build.targets.wheel]
packages = ["src/flowcastle"]

[tool.pytest.ini_options]
asyncio_mode = "auto"
testpaths = ["tests"]

[tool.mypy]
python_version = "3.10"
strict = true
files = ["src/flowcastle"]
