name: SDK CI

on:
  push:
    branches: [main]
  pull_request:

permissions:
  contents: read

jobs:
  node:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: pnpm/action-setup@v6
        with:
          version: 10.9.0
      - uses: actions/setup-node@v7
        with:
          node-version: 20
          cache: pnpm
      - run: pnpm install --frozen-lockfile
      - run: pnpm build
      - run: pnpm test:node
      - run: pnpm typecheck:examples

  python:
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        python-version: ['3.10', '3.12', '3.13']
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-python@v7
        with:
          python-version: ${{ matrix.python-version }}
          cache: pip
      - run: python -m pip install -e './packages/sdk-python[dev,aiogram,python-telegram-bot]'
      - run: PYTHONPATH=packages/sdk-python/src python -m pytest packages/sdk-python/tests
      - run: python -m mypy --config-file packages/sdk-python/pyproject.toml packages/sdk-python/src/flowcastle
      - run: python -m py_compile examples/aiogram-bot/bot.py examples/python-telegram-bot-bot/bot.py
